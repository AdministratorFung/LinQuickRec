# Two-container demo: server + client.
#
# Prerequisite: build Bazel binaries first
#   cd services/ub-demo
#   bazel build //:ub_demo_server //:ub_demo_client \
#       --override_repository=brpc=/path/to/brpc-fork
#
# Then run:
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml up
#   docker compose logs client

services:
  server:
    build:
      context: ../..
      dockerfile: services/ub-demo/Dockerfile
      args:
        BUILD_BIN_DIR: services/ub-demo/bazel-bin
    command:
      - "/app/ub_demo_server"
      - "--ubsocket_use_ub"
      - "--port=8080"
      - "--ubsocket_auto_fallback_tcp=true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/EchoService/Echo", "-d", '{"message":"health"}']
      interval: 2s
      timeout: 3s
      retries: 10

  client:
    build:
      context: ../..
      dockerfile: services/ub-demo/Dockerfile
      args:
        BUILD_BIN_DIR: services/ub-demo/bazel-bin
    command:
      - "/app/ub_demo_client"
      - "--ubsocket_use_ub"
      - "--server=server:8080"
      - "--count=10"
      - "--message=hello_ub"
      - "--ubsocket_auto_fallback_tcp=true"
    depends_on:
      server:
        condition: service_healthy
    restart: "no"
