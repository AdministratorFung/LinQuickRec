server {
    listen 32000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://perf-collector-service:8080;
        proxy_set_header Host $host;
    }

    location /Proxy/ {
        proxy_pass http://proxy-service:8080;
        proxy_set_header Host $host;
    }
}
