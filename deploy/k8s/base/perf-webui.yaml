# Perf WebUI — nginx 静态文件服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-webui
  namespace: linquickrec
  labels:
    app: perf-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perf-webui
  template:
    metadata:
      labels:
        app: perf-webui
    spec:
      containers:
      - name: webui
        image: linquickrec/perf-webui:latest
        ports:
        - containerPort: 32000
          name: http
        resources:
          requests:
            cpu: "0.1"
            memory: "32Mi"
          limits:
            cpu: "0.2"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /index.html
            port: 32000
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /index.html
            port: 32000
          initialDelaySeconds: 5
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: perf-webui
  namespace: linquickrec
spec:
  selector:
    app: perf-webui
  ports:
  - name: http
    port: 32000
    targetPort: 32000
    nodePort: 32000
  type: NodePort
